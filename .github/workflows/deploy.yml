name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR=/var/www/insta-clone
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -d .git ]; then
              git clone https://github.com/allen222star/insta-clone.git "$APP_DIR"
            fi
            git fetch origin
            git checkout main
            git pull origin main
            if [ ! -f deploy.sh ]; then
            cat > deploy.sh << 'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            cd /var/www/insta-clone
            git pull origin main
            export APP_ENV=server
            if [ ! -d backend/.venv ]; then python3 -m venv backend/.venv; fi
            source backend/.venv/bin/activate
            pip install -r backend/requirements.txt
            (cd backend && alembic upgrade head)
            pm2 restart all
            echo "deploy ok"
            EOF
            fi
            chmod +x deploy.sh
            ./deploy.sh
