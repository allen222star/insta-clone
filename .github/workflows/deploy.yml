name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          fail=0
          if [ -z "${HOST// }" ]; then echo "::error::SERVER_HOST is empty"; fail=1; fi
          if [ -z "${SSH_USER// }" ]; then echo "::error::SERVER_USER is empty"; fail=1; fi
          if [ -z "${KEY// }" ]; then echo "::error::SERVER_SSH_KEY is empty"; fail=1; fi
          if [ -n "$KEY" ] && ! printf '%s\n' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::SERVER_SSH_KEY must be an OpenSSH private key (-----BEGIN ... PRIVATE KEY-----)"
            fail=1
          fi
          echo "host_len=${#HOST} user_len=${#SSH_USER} key_len=${#KEY}"
          exit "$fail"

      - name: Restore SSH key and target
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          python3 << 'PY'
          import os
          import pathlib
          import re

          def clean(value: str) -> str:
              value = (value or "").strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
                  value = value[1:-1].strip()
              return value

          def restore_key(raw: str) -> str:
              text = raw.strip()
              if len(text) >= 2 and text[0] == text[-1] and text[0] in {"'", '"'}:
                  text = text[1:-1]
              text = text.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r", "")
              if text.count("\n") >= 3:
                  return text if text.endswith("\n") else text + "\n"
              match = re.search(r"-----BEGIN ([A-Z0-9 ]+PRIVATE KEY)-----", text)
              if not match:
                  return text if text.endswith("\n") else text + "\n"
              kind = match.group(1)
              start = f"-----BEGIN {kind}-----"
              end = f"-----END {kind}-----"
              begin_at = text.find(start)
              end_at = text.find(end)
              if begin_at < 0 or end_at < 0:
                  return text if text.endswith("\n") else text + "\n"
              body = re.sub(r"\s+", "", text[begin_at + len(start) : end_at])
              width = 70 if "OPENSSH" in kind else 64
              wrapped = "\n".join(body[i : i + width] for i in range(0, len(body), width))
              return f"{start}\n{wrapped}\n{end}\n"

          host = clean(os.environ.get("HOST", ""))
          host = re.sub(r"^https?://", "", host, flags=re.I)
          host = host.split("/")[0]
          user = clean(os.environ.get("SSH_USER", ""))
          port = clean(os.environ.get("PORT", "") or "22") or "22"
          key = restore_key(os.environ.get("KEY", ""))

          ssh_dir = pathlib.Path.home() / ".ssh"
          ssh_dir.mkdir(mode=0o700, exist_ok=True)
          key_path = ssh_dir / "deploy_key"
          key_path.write_text(key)
          key_path.chmod(0o600)
          pathlib.Path("/tmp/deploy_host").write_text(host)
          pathlib.Path("/tmp/deploy_user").write_text(user)
          pathlib.Path("/tmp/deploy_port").write_text(port)
          header = key.splitlines()[0] if key.splitlines() else ""
          footer = key.splitlines()[-1] if key.splitlines() else ""
          print(f"host_chars={len(host)} user_chars={len(user)} port={port}")
          print(f"key_lines={key.count(chr(10))} header={header} footer={footer}")
          PY
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/deploy_key" >/tmp/deploy_pub; then
            echo "::error::SERVER_SSH_KEY is not a usable OpenSSH private key. Paste the PEM/OPENSSH private key with real line breaks, not the .pub file."
            exit 1
          fi

      - name: Deploy over SSH
        run: |
          set -euo pipefail
          HOST=$(cat /tmp/deploy_host)
          USER_NAME=$(cat /tmp/deploy_user)
          PORT=$(cat /tmp/deploy_port)
          ssh-keyscan -p "$PORT" -T 15 "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          ssh -i "$HOME/.ssh/deploy_key" -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=10 \
            "${USER_NAME}@${HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          export APP_ENV=server
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            # shellcheck disable=SC1090
            . "$NVM_DIR/nvm.sh"
            nvm use 20 >/dev/null 2>&1 || true
          fi
          export PATH="/usr/local/bin:/usr/bin:$HOME/.local/bin:$PATH"

          APP_DIR=/var/www/insta-clone
          if [ ! -d "$APP_DIR/.git" ]; then
            sudo mkdir -p "$APP_DIR"
            sudo chown "$(id -un):$(id -gn)" "$APP_DIR"
            git clone https://github.com/allen222star/insta-clone.git "$APP_DIR"
          fi
          cd "$APP_DIR"
          git fetch origin
          git checkout main
          git reset --hard origin/main
          chmod +x deploy.sh
          ./deploy.sh
          REMOTE
